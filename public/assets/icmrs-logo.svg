<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="logoLeafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80" />
      <stop offset="100%" stop-color="#15803d" />
    </linearGradient>
    <linearGradient id="logoBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
  </defs>
  <!-- Background Disc -->
  <circle cx="100" cy="100" r="96" fill="url(#logoBgGrad)" />
  <circle cx="100" cy="100" r="94" fill="none" stroke="#60a5fa" stroke-width="2.5" />

  <!-- White Inner Shield/Disc -->
  <circle cx="100" cy="100" r="76" fill="#ffffff" />
  
  <!-- Navy Skyline -->
  <g transform="translate(100, 95)">
    <!-- Base line -->
    <path d="M-45 18 L-45 4 L-34 4 L-34 -8 L-22 -8 L-22 -24 L-8 -24 L-8 -42 L6 -42 L6 -2 L18 -2 L18 10 L45 10 L45 18 Z" fill="#1e3a8a" />
    <!-- Leaf on the right -->
    <path d="M4 -8 C34 -44 48 -10 32 16 C18 10 14 -2 4 -8 Z" fill="url(#logoLeafGrad)" />
    <path d="M8 -4 Q24 2 28 14" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" fill="none" />
  </g>

  <!-- Bottom ICMRS Text Banner -->
  <rect x="35" y="142" width="130" height="28" rx="8" fill="#1e3a8a" />
  <text x="100" y="162" font-family="'Plus Jakarta Sans', 'Inter', system-ui, sans-serif" font-weight="900" font-size="16" fill="#ffffff" text-anchor="middle" letter-spacing="1.5">ICMRS</text>
</svg>
